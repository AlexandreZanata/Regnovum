# Supply-chain verification (P16-T08; extended by P19-T08).
#
# Every third-party action is pinned to an immutable commit SHA, with the tag it
# points to in a comment. The workflow has no write access to the repository and
# never receives production secrets: the only secret it reads is the token
# GitHub itself issues to the run.
#
# The Go vulnerability gate runs **the Makefile target** (`make vuln`), not a
# copy of its command, so the CI and an operator ask the same question. The
# scanner is still installed here, pinned, because the gate refuses to run
# without it.
#
# Full supply-chain scans run on a version tag or manual release candidate.
name: supply-chain

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-scans:
    name: Source and manifest scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The version is pinned here and named in the gate's own refusal message,
      # so a machine that cannot run `make vuln` fails the same way CI would.
      - name: Install Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Scan Go dependencies
        run: make vuln

      - name: Audit frontend dependencies
        run: npm audit --prefix web --audit-level=high

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        with:
          config: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The other image in production is the database. The application image is
      # scanned in `verify.yml`, on the artifact that same run builds, because a
      # scan of an image nobody built would be a scan of a tag.
      - name: Scan the declared PostgreSQL image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: postgres:18.6-alpine
          scanners: vuln
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
